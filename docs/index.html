<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — Opportunity Radar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0D1210;
    --panel: #141B18;
    --panel-edge: #1F2A25;
    --amber: #FFB020;
    --teal: #2DD9B9;
    --violet: #B98BFF;
    --rose: #FF7A93;
    --text: #EDEFE9;
    --muted: #7C8A82;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size: 22px 22px;
  }
  header{
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--panel-edge);
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;
  }
  .brand{display:flex; flex-direction:column; gap:4px;}
  .brand h1{
    font-family:'Space Grotesk', sans-serif; font-size:28px; font-weight:700; letter-spacing:0.5px;
    display:flex; align-items:center; gap:10px;
  }
  .brand h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--teal); box-shadow:0 0 10px var(--teal); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.35}}
  .brand p{color:var(--muted); font-size:13px; font-family:'IBM Plex Mono', monospace;}
  .telemetry{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); display:flex; gap:22px; align-items:center;}
  .telemetry .stat{display:flex; flex-direction:column; gap:2px; align-items:flex-end;}
  .telemetry .stat b{color:var(--text); font-size:14px;}
  .bars{display:flex; gap:2px; align-items:flex-end; height:16px;}
  .bars span{width:3px; background:var(--teal); animation:bar 1.2s infinite ease-in-out;}
  .bars span:nth-child(1){height:40%; animation-delay:0s;}
  .bars span:nth-child(2){height:100%; animation-delay:0.15s;}
  .bars span:nth-child(3){height:60%; animation-delay:0.3s;}
  .bars span:nth-child(4){height:80%; animation-delay:0.45s;}
  @keyframes bar{0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)}}

  nav{display:flex; gap:0; padding: 0 32px; border-bottom:1px solid var(--panel-edge); overflow-x:auto;}
  .tab{
    font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.5px; color:var(--muted);
    background:none; border:none; padding:16px 18px 14px; cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap; text-transform:uppercase;
  }
  .tab.active{color:var(--amber); border-bottom-color:var(--amber);}
  .tab:hover{color:var(--text);}

  .controls{padding: 18px 32px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .controls input{
    background:var(--panel); border:1px solid var(--panel-edge); color:var(--text);
    padding:9px 14px; border-radius:6px; font-family:'Inter'; font-size:13px; flex:1; min-width:200px;
  }
  .controls input:focus{outline:1px solid var(--teal);}
  .refresh-btn{
    background:var(--panel); border:1px solid var(--panel-edge); color:var(--teal);
    padding:9px 16px; border-radius:6px; font-family:'IBM Plex Mono'; font-size:12px;
    cursor:pointer; text-transform:uppercase; letter-spacing:0.5px;
  }
  .refresh-btn:hover{border-color:var(--teal);}
  .refresh-btn:disabled{opacity:0.5; cursor:wait;}

  main{padding: 22px 32px 60px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px;}
  .card{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px;
    padding:18px; display:flex; flex-direction:column; gap:10px; transition:border-color 0.15s;
  }
  .card:hover{border-color:var(--teal);}
  .card .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card h3{font-size:15px; font-weight:600; line-height:1.35;}
  .tag{
    font-family:'IBM Plex Mono'; font-size:10px; padding:3px 8px; border-radius:20px;
    background:rgba(255,176,32,0.12); color:var(--amber); white-space:nowrap; text-transform:uppercase;
  }
  .tag.internship{background:rgba(45,217,185,0.12); color:var(--teal);}
  .tag.bounty-web3{background:rgba(185,139,255,0.14); color:var(--violet);}
  .tag.scholarship{background:rgba(255,122,147,0.14); color:var(--rose);}
  .card .meta{color:var(--muted); font-size:12px; font-family:'IBM Plex Mono'; display:flex; gap:12px; flex-wrap:wrap;}
  .card .src{color:var(--muted); font-size:10px; font-family:'IBM Plex Mono'; opacity:0.7;}
  .card a.apply{
    margin-top:auto; align-self:flex-start; color:var(--teal); font-size:12px; text-decoration:none;
    border-bottom:1px solid var(--teal); font-family:'IBM Plex Mono';
  }
  .card a.apply:hover{color:var(--amber); border-color:var(--amber);}
  .state-msg{text-align:center; color:var(--muted); padding:60px 20px; font-family:'IBM Plex Mono'; font-size:13px; grid-column:1/-1; line-height:1.7;}
  .source-note{font-family:'IBM Plex Mono'; font-size:11px; color:var(--muted); padding:14px 32px 0;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1><span class="dot"></span>SIGNAL</h1>
    <p>opportunity radar — electrical/electronics eng · automation · oil &amp; gas</p>
  </div>
  <div class="telemetry">
    <div class="bars"><span></span><span></span><span></span><span></span></div>
    <div class="stat">DATA AS OF<b id="syncTime">—</b></div>
    <div class="stat">RESULTS<b id="resultCount">0</b></div>
  </div>
</header>

<nav>
  <button class="tab active" data-tab="hackathons">Hackathons</button>
  <button class="tab" data-tab="internships">Internships</button>
  <button class="tab" data-tab="jobs">Jobs</button>
  <button class="tab" data-tab="scholarships">Scholarships</button>
</nav>

<div class="controls">
  <input type="text" id="searchBox" placeholder="Filter by keyword...">
  <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
</div>
<div class="source-note" id="sourceNote"></div>

<main>
  <div class="grid" id="grid">
    <div class="state-msg">Loading feed…</div>
  </div>
</main>

<script>
const grid = document.getElementById('grid');
const searchBox = document.getElementById('searchBox');
const refreshBtn = document.getElementById('refreshBtn');
const syncTime = document.getElementById('syncTime');
const resultCount = document.getElementById('resultCount');
const sourceNote = document.getElementById('sourceNote');
const tabs = document.querySelectorAll('.tab');

let currentTab = 'hackathons';
let dataset = null;

const NOTES = {
  hackathons: "General + Nigeria + Web3/bounty/grant platforms — Devpost is live-scraped, the rest are curated direct links",
  internships: "Strictly Nigeria, strictly electrical/electronics/automation/oil & gas — live-scraped from NG job board feeds",
  jobs: "Strictly Nigeria, strictly electrical/electronics/automation/oil & gas — live-scraped from NG job board feeds",
  scholarships: "Fully-funded programs abroad — mix of live feeds and a fixed backbone list (Chevening, DAAD, Commonwealth, etc.)"
};

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    searchBox.value = '';
    render();
  });
});
searchBox.addEventListener('input', render);
refreshBtn.addEventListener('click', () => load(true));

async function load(force) {
  refreshBtn.disabled = true;
  refreshBtn.textContent = 'loading…';
  try {
    const res = await fetch('data.json' + (force ? ('?t=' + Date.now()) : ''));
    if (!res.ok) throw new Error('no data.json yet');
    dataset = await res.json();
    syncTime.textContent = dataset.generated_at ? new Date(dataset.generated_at).toLocaleString() : 'no data yet';
  } catch (e) {
    console.warn('data.json unavailable — the scraper may not have run yet.', e);
    dataset = { hackathons: [], internships: [], jobs: [], scholarships: [] };
    syncTime.textContent = 'no data yet';
  }
  refreshBtn.disabled = false;
  refreshBtn.textContent = '↻ Refresh';
  render();
}

function tagClass(tag){
  const t = (tag || '').toLowerCase().replace('/', '-');
  return t; // matches .tag.internship, .tag.bounty-web3, .tag.scholarship
}

function render() {
  const items = (dataset && dataset[currentTab]) || [];
  sourceNote.textContent = NOTES[currentTab];
  grid.innerHTML = '';

  if (!dataset || items.length === 0) {
    grid.innerHTML = `<div class="state-msg">
      No results yet on this tab.<br>
      If you just set this up: Actions tab → "Refresh opportunity data" → Run workflow.<br>
      If it's already run and this tab is still empty, one or more source feeds for
      this category may need a fixed URL — worth flagging so it can be swapped in.
    </div>`;
    resultCount.textContent = '0';
    return;
  }

  const q = searchBox.value.trim().toLowerCase();
  const filtered = q
    ? items.filter(d => (d.title + ' ' + d.org + ' ' + d.location + ' ' + d.type).toLowerCase().includes(q))
    : items;

  resultCount.textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="state-msg">No matches. Try a different keyword.</div>`;
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="row1">
        <h3>${escapeHtml(item.title || '')}</h3>
        <span class="tag ${tagClass(item.tag)}">${escapeHtml(item.tag || '')}</span>
      </div>
      <div class="meta">${escapeHtml(item.org || '')}</div>
      <div class="meta">${[item.location, item.type].filter(Boolean).map(escapeHtml).join(' · ')}</div>
      <a class="apply" href="${item.url}" target="_blank" rel="noopener">View / Apply →</a>
      <div class="src">via ${escapeHtml(item.source || '')}</div>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

load(false);
</script>
</body>
</html>
